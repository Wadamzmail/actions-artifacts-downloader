name: Send Artifact to Telegram

on:
  workflow_dispatch:
    inputs:
      run_url:
        description: "GitHub Actions run URL"
        required: true
        type: string

      artifact_name:
        description: "Artifact name"
        required: true
        type: string

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

permissions:
  actions: read

jobs:
  send-artifact:
    name: Download, split and send artifact
    runs-on: ubuntu-latest

    steps:
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Parse run URL
        id: run
        env:
          RUN_URL: ${{ inputs.run_url }}
        run: |
          set -euo pipefail

          if [[ "$RUN_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/actions/runs/([0-9]+) ]]; then
            OWNER="${BASH_REMATCH[1]}"
            REPO="${BASH_REMATCH[2]}"
            RUN_ID="${BASH_REMATCH[3]}"
          else
            echo "::error::Invalid GitHub Actions run URL"
            exit 1
          fi

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "Repository: $OWNER/$REPO"
          echo "Run ID: $RUN_ID"

      - name: Find artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.run.outputs.owner }}
          REPO: ${{ steps.run.outputs.repo }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          echo "Looking for artifact:"
          echo "$ARTIFACT_NAME"

          ARTIFACTS="$(
            gh api \
              "/repos/$OWNER/$REPO/actions/runs/$RUN_ID/artifacts" \
              --paginate
          )"

          ARTIFACT_ID="$(
            echo "$ARTIFACTS" |
              jq -r \
                --arg NAME "$ARTIFACT_NAME" \
                '.artifacts[]
                 | select(.name == $NAME)
                 | select(.expired == false)
                 | .id' |
              head -n 1
          )"

          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Artifact '$ARTIFACT_NAME' was not found or is expired."

            echo
            echo "Available artifacts:"

            echo "$ARTIFACTS" |
              jq -r \
                '.artifacts[]
                 | "  - \(.name) (expired=\(.expired))"'

            exit 1
          fi

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          echo "Found artifact ID: $ARTIFACT_ID"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.run.outputs.owner }}
          REPO: ${{ steps.run.outputs.repo }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail

          mkdir -p download

          echo "Downloading artifact..."

          gh api \
            --method GET \
            "/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            > download/artifact.zip

          echo "Downloaded artifact:"
          ls -lh download/artifact.zip

      - name: Extract artifact ZIP
        run: |
          set -euo pipefail

          mkdir -p extracted

          echo "Extracting artifact..."

          unzip -q \
            download/artifact.zip \
            -d extracted

          echo
          echo "Extracted files:"
          find extracted \
            -type f \
            -printf '%p\n'

      - name: Create split 7z archive
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          mkdir -p parts

          echo "Creating 45 MB multi-volume archive..."

          7z a \
            -v45m \
            -mx=0 \
            "parts/${ARTIFACT_NAME}.7z" \
            ./extracted/*

          echo
          echo "Generated parts:"
          ls -lh parts/

      - name: Verify generated parts
        run: |
          set -euo pipefail

          PART_COUNT="$(
            find parts \
              -maxdepth 1 \
              -type f \
              -name '*.7z.*' |
            wc -l
          )"

          if [[ "$PART_COUNT" -eq 0 ]]; then
            echo "::error::No archive parts were created."
            exit 1
          fi

          echo "Created $PART_COUNT parts."

          ls -lh parts/

      - name: Send parts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail

          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not configured."
            exit 1
          fi

          mapfile -t PARTS < <(
            find parts \
              -maxdepth 1 \
              -type f \
              -name '*.7z.*' |
            sort -V
          )

          TOTAL="${#PARTS[@]}"

          echo "Sending $TOTAL parts..."

          for INDEX in "${!PARTS[@]}"; do
            FILE="${PARTS[$INDEX]}"
            NUMBER=$((INDEX + 1))

            echo
            echo "Sending part $NUMBER/$TOTAL:"
            echo "$FILE"

            RESPONSE="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                --form "chat_id=${TELEGRAM_CHAT_ID}" \
                --form "document=@${FILE}" \
                --form "caption=📦 ${ARTIFACT_NAME} — part ${NUMBER}/${TOTAL}"
            )"

            echo "$RESPONSE" |
              jq .

            OK="$(
              echo "$RESPONSE" |
                jq -r '.ok'
            )"

            if [[ "$OK" != "true" ]]; then
              echo "::error::Telegram failed to send part $NUMBER."
              exit 1
            fi

            echo "✅ Part $NUMBER/$TOTAL sent."

            sleep 1
          done

          echo
          echo "🎉 All parts sent successfully."
